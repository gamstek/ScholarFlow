name: Docker image

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build image for smoke check
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          # CI always uses upstream sources. Mirrors are only for local builds.
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
            CONDA_CHANNEL=https://conda.anaconda.org/conda-forge
            PIP_INDEX_URL=https://pypi.org/simple
            TORCH_WHEEL_URL=https://download.pytorch.org/whl/cpu/torch/
          load: true
          tags: scholarflow:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check model preparation lifecycle
        shell: bash
        run: |
          docker run --rm \
            --mount "type=bind,source=$PWD/tests,target=/tests,readonly" \
            scholarflow:ci bash -c \
            'source /opt/conda/etc/profile.d/conda.sh && conda activate scholarflow && python -m unittest discover -s /tests -p test_prepare_model.py -v'

      - name: Prepare real BGE-M3 and verify offline reuse
        shell: bash
        run: |
          set -euo pipefail
          docker volume create scholarflow-ci-embedding
          docker run --name scholarflow-ci-model-init \
            -v scholarflow-ci-embedding:/app/embedding \
            -e HF_ENDPOINT=https://huggingface.co -e HF_HUB_OFFLINE=0 \
            scholarflow:ci python -m app.rag.prepare_model
          # A second initialization must succeed even without network access.
          docker run --rm --network none \
            -v scholarflow-ci-embedding:/app/embedding \
            scholarflow:ci python -m app.rag.prepare_model

      - name: Smoke check with PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker network create scholarflow-ci
          docker run -d --name scholarflow-ci-db --network scholarflow-ci --network-alias db \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=scholarflow \
            -e POSTGRES_DB=scholarflow postgres:16-alpine
          for attempt in $(seq 1 30); do
            if docker exec scholarflow-ci-db pg_isready -U postgres -d scholarflow; then
              break
            fi
            echo "Waiting for PostgreSQL (${attempt}/30)"
            sleep 2
          done
          docker exec scholarflow-ci-db pg_isready -U postgres -d scholarflow
          docker run -d --name scholarflow-ci-app --network scholarflow-ci \
            -p 127.0.0.1:8000:8000 \
            -v scholarflow-ci-embedding:/app/embedding:ro \
            -e DATABASE_URL=postgresql+asyncpg://postgres:scholarflow@db:5432/scholarflow \
            -e LLM_BACKEND=deepseek -e HF_HUB_OFFLINE=1 scholarflow:ci
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors \
            --max-time 10 http://127.0.0.1:8000/health
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8000/ > /tmp/index.html
          grep -q '/assets/' /tmp/index.html
          asset=$(grep -oE '/assets/[^" ]+\.js' /tmp/index.html | head -n 1)
          curl --fail --silent --show-error --max-time 10 "http://127.0.0.1:8000${asset}" > /dev/null
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8000/stats
          curl --fail --silent --show-error --max-time 10 'http://127.0.0.1:8000/papers?limit=1'
          for attempt in $(seq 1 60); do
            if docker logs scholarflow-ci-app 2>&1 | grep -q 'BGE-M3 embedding model warmed up'; then
              break
            fi
            echo "Waiting for BGE-M3 warmup (${attempt}/60)"
            sleep 2
          done
          docker logs scholarflow-ci-app 2>&1 | grep 'BGE-M3 embedding model warmed up'

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish checked image
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              docker tag scholarflow:ci "$tag"
              docker push "$tag"
            fi
          done <<< "$IMAGE_TAGS"

      - name: Container logs on failure
        if: failure()
        run: |
          docker logs scholarflow-ci-app || true
          docker logs scholarflow-ci-db || true
          docker logs scholarflow-ci-model-init || true

      - name: Clean up smoke check
        if: always()
        run: |
          docker rm -f scholarflow-ci-app scholarflow-ci-db scholarflow-ci-model-init || true
          docker network rm scholarflow-ci || true
          docker volume rm scholarflow-ci-embedding || true
