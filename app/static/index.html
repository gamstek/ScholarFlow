<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lit-agent</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <div class="page">
        <header class="header">
            <div>
                <h1>ScholarFlow</h1>
                <p>通用文献采集与检索智能体</p>
            </div>
            <button id="statsButton" class="secondary-button">查看系统状态</button>
        </header>

        <main class="main">
            <!-- Agent 任务面板 -->
            <section class="card agent-card">
                <h2>Agent 任务</h2>
                <div class="agent-input-row">
                    <div style="flex:1">
                        <label for="agentIntentInput">研究意图</label>
                        <input
                            id="agentIntentInput"
                            type="text"
                            placeholder="例如：跟踪 HMO 质谱解析文献"
                        />
                    </div>
                    <div style="flex:1">
                        <label for="agentQuestionInput">具体问题</label>
                        <input
                            id="agentQuestionInput"
                            type="text"
                            placeholder="例如：HMO 的 LC-MS/MS 结构解析通常用哪些方法？"
                        />
                    </div>
                </div>

                <div class="progress-bar" id="agentProgressBar" style="display:none">
                    <div class="progress-stages" id="agentProgressStages">
                        <span class="stage-dot" data-stage="crawl">采集</span>
                        <span class="stage-dot" data-stage="download">下载</span>
                        <span class="stage-dot" data-stage="parse">解析</span>
                        <span class="stage-dot" data-stage="chunk">切块</span>
                        <span class="stage-dot" data-stage="index">索引</span>
                        <span class="stage-dot" data-stage="rag_search">检索</span>
                        <span class="stage-dot" data-stage="qa">回答</span>
                    </div>
                </div>

                <div class="actions">
                    <button id="agentRunButton">启动 Agent 任务</button>
                    <button id="agentApproveButton" class="secondary-button" style="display:none">确认执行</button>
                    <button id="agentRejectButton" class="secondary-button" style="display:none">取消</button>
                </div>

                <div id="agentAnswerBox" class="answer-box" style="display:none"></div>
                <div id="agentSourcesBox" class="sources-box" style="display:none"></div>
                <p id="agentStatusText" class="status-text">状态：等待操作</p>
            </section>

                <label for="questionInput">问题</label>
                <textarea
                    id="questionInput"
                    rows="4"
                    placeholder="例如：HMO 的 LC-MS/MS 结构解析通常用哪些方法？"
                >HMO 的 LC-MS/MS 结构解析通常用哪些方法？</textarea>

                <div class="grid">
                    <div>
                        <label for="topKInput">Top K</label>
                        <input id="topKInput" type="number" value="2" min="1" max="20" />
                    </div>

                    <div>
                        <label for="maxCharsInput">每条证据字符数</label>
                        <input id="maxCharsInput" type="number" value="600" min="200" max="3000" />
                    </div>

                    <div>
                        <label for="numCtxInput">num_ctx</label>
                        <input id="numCtxInput" type="number" value="4096" min="512" />
                    </div>

                    <div>
                        <label for="numPredictInput">num_predict</label>
                        <input id="numPredictInput" type="number" value="384" min="64" max="4096" />
                    </div>

                    <div>
                        <label for="embeddingDeviceInput">Embedding 设备</label>
                        <select id="embeddingDeviceInput">
                            <option value="cuda" selected>cuda</option>
                            <option value="cpu">cpu</option>
                            <option value="">auto</option>
                        </select>
                    </div>

                    <div>
                        <label for="ollamaModelInput">Ollama 模型</label>
                        <input id="ollamaModelInput" type="text" value="qwen3:8b" />
                    </div>

                    <div>
                        <label for="thinkModeInput">Think 模式</label>
                        <select id="thinkModeInput">
                            <option value="off" selected>off</option>
                            <option value="omit">omit</option>
                            <option value="on">on</option>
                        </select>
                    </div>

                    <div>
                        <label for="generateInput">是否生成回答</label>
                        <select id="generateInput">
                            <option value="true" selected>是</option>
                            <option value="false">否，只检索 sources</option>
                        </select>
                    </div>
                </div>

                <div class="actions">
                    <button id="askButton">提问</button>
                    <button id="warmupButton" class="secondary-button">预热检索器</button>
                    <button id="clearButton" class="secondary-button">清空结果</button>
                </div>

                <p id="statusText" class="status-text">状态：等待操作</p>
            </section>

            <section class="card">
                <h2>回答</h2>
                <div id="answerBox" class="answer-box">暂无回答。</div>
            </section>

            <section class="card">
                <h2>引用来源</h2>
                <div id="sourcesBox" class="sources-box">暂无来源。</div>
            </section>

            <section class="card">
                <h2>系统状态</h2>
                <pre id="statsBox" class="json-box">尚未加载。</pre>
            </section>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
