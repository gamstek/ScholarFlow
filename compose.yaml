name: scholarflow

services:
  app:
    image: ${SCHOLARFLOW_IMAGE:-ghcr.io/gamstek/scholarflow:latest}
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-scholarflow}@db:5432/scholarflow
      BGE_MODEL_PATH: /app/embedding/bge-m3
      HF_HUB_OFFLINE: "1"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./embedding:/app/embedding:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      model-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  model-init:
    image: ${SCHOLARFLOW_IMAGE:-ghcr.io/gamstek/scholarflow:latest}
    platform: linux/amd64
    restart: "no"
    command: ["python", "-m", "app.rag.prepare_model"]
    environment:
      BGE_MODEL_PATH: /app/embedding/bge-m3
      HF_HUB_OFFLINE: "0"
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HUB_DOWNLOAD_TIMEOUT: "60"
      HF_HUB_ETAG_TIMEOUT: "30"
    volumes:
      - ./embedding:/app/embedding
    healthcheck:
      disable: true

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scholarflow}
      POSTGRES_DB: scholarflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scholarflow"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
